<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunker Down Explorer</title>
    <link rel="icon" href="https://fav.farm/🏕️" />

    <link href="./style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300;0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        // Theme FOUC fix
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body x-data="hunkerApp"
    class="bg-zinc-50 text-zinc-800 dark:bg-zinc-900 dark:text-zinc-200 transition-colors duration-300 font-sans antialiased flex flex-col p-4 md:p-8 dark:[color-scheme:dark]">

    <div class="max-w-6xl mx-auto w-full flex flex-col h-full gap-6">

        <header class="flex justify-between items-start md:items-center mb-6">
            <h1 class="text-4xl md:text-5xl font-bold tracking-widest uppercase text-zinc-900 dark:text-zinc-100">
                🏕️ HUNKER DOWN EXPLORER
            </h1>

            <button @click="toggleTheme()"
                class="p-2 mt-1 rounded-full text-zinc-500 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors focus:outline-none shrink-0"
                aria-label="Toggle Theme">
                <svg x-show="!isDark" x-cloak class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                <svg x-show="isDark" x-cloak class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                    </path>
                </svg>
            </button>
        </header>

        <div class="flex flex-col xl:flex-row gap-4 items-center w-full">

            <div class="flex items-center gap-2">
                <span class="font-bold text-lg mr-2">Sort</span>
                <select x-model="sortBy"
                    class="h-11 bg-zinc-300 dark:bg-zinc-700 text-zinc-800 dark:text-zinc-200 px-3 font-bold border-2 border-transparent focus:outline-none focus:border-zinc-500 cursor-pointer transition">
                    <option value="date">Date</option>
                    <option value="name">Name</option>
                </select>
                <button @click="sortDesc = !sortDesc" x-text="sortDesc ? '↓ Desc' : '↑ Asc'"
                    class="h-11 px-3 font-bold bg-zinc-300 dark:bg-zinc-700 text-zinc-800 dark:text-zinc-200 hover:bg-zinc-400 dark:hover:bg-zinc-600 transition w-24 text-center border-2 border-transparent"></button>
            </div>

            <div class="flex items-center gap-2 xl:pl-4">
                <span class="font-bold text-lg mr-2">Filter</span>
                <button @click="currentFilter = currentFilter === 'stealth' ? null : 'stealth'"
                    :class="currentFilter === 'stealth' ? 'bg-zinc-500 dark:bg-zinc-600 text-white border-zinc-500 shadow-inner' : 'bg-zinc-300 dark:bg-zinc-700 text-zinc-600 dark:text-zinc-300 border-transparent'"
                    class="px-5 py-2 font-bold border transition">Stealth</button>
                <button @click="currentFilter = currentFilter === 'non-stealth' ? null : 'non-stealth'"
                    :class="currentFilter === 'non-stealth' ? 'bg-zinc-500 dark:bg-zinc-600 text-white border-zinc-500 shadow-inner' : 'bg-zinc-300 dark:bg-zinc-700 text-zinc-600 dark:text-zinc-300 border-transparent'"
                    class="px-5 py-2 font-bold border transition">Non-Stealth</button>
            </div>

            <div class="flex-grow w-full xl:w-auto xl:ml-4">
                <input type="text" x-model="searchQuery" placeholder="Search..."
                    class="w-full border-2 border-zinc-900 dark:border-zinc-600 bg-white dark:bg-zinc-800 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-zinc-500 font-bold text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 transition-colors">
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-6 flex-grow items-stretch">

            <div class="w-full md:w-1/3 relative">
                <div
                    class="w-full flex flex-col gap-3 overflow-y-auto pr-2 pb-4 max-h-[50vh] md:max-h-none md:absolute md:inset-0">
                    <template x-if="filteredCamps.length === 0">
                        <p class="text-zinc-500 dark:text-zinc-400 font-bold p-4">No results found.</p>
                    </template>
                    <template x-for="camp in filteredCamps" :key="camp.video_id">
                        <div @click="activeCamp = camp"
                            :class="activeCamp === camp ? 'bg-zinc-400 dark:bg-zinc-600 border-zinc-900 dark:border-zinc-400' : 'bg-white dark:bg-zinc-800 border-zinc-900 dark:border-zinc-600 hover:bg-zinc-100 dark:hover:bg-zinc-700'"
                            class="p-4 border-2 cursor-pointer transition-colors flex flex-col shrink-0">
                            <h3 x-text="camp.title"
                                class="font-bold text-zinc-900 dark:text-zinc-100 text-lg leading-tight mb-2"></h3>
                            <div class="flex justify-between items-center text-sm font-bold mt-auto">
                                <span x-text="camp.stealth ? 'Stealth' : 'Non-Stealth'"
                                    class="px-2 py-0.5 bg-zinc-200 text-zinc-600 border border-zinc-400 dark:bg-zinc-700 dark:text-zinc-300 dark:border-zinc-600"></span>
                                <span class="text-zinc-600 dark:text-zinc-400 flex items-center gap-1">
                                    <span class="text-blue-400 dark:text-blue-500">🗓️</span> <span
                                        x-text="camp.date"></span>
                                </span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div
                class="w-full md:w-2/3 flex flex-col border-2 border-zinc-900 dark:border-zinc-600 bg-white dark:bg-zinc-800 transition-colors">

                <template x-if="activeCamp">
                    <div class="flex flex-col h-full">
                        <div
                            class="h-[50vh] md:h-[60vh] shrink-0 border-b-2 border-zinc-900 dark:border-zinc-600 relative bg-zinc-200 dark:bg-zinc-700 transition-colors">
                            <iframe width="100%" height="100%" frameborder="0" style="border:0"
                                :src="`https://maps.google.com/maps?q=${encodeURIComponent(activeCamp.location)}&t=k&z=18&ie=UTF8&iwloc=&output=embed`"
                                allowfullscreen></iframe>
                        </div>

                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex flex-wrap items-center gap-3 mb-2">
                                <span x-text="activeCamp.stealth ? 'Stealth' : 'Non-Stealth'"
                                    class="px-2 py-1 text-sm font-bold text-zinc-600 bg-zinc-200 border border-zinc-400 dark:text-zinc-300 dark:bg-zinc-700 dark:border-zinc-600"></span>
                                <h2 x-text="activeCamp.title"
                                    class="text-xl md:text-2xl font-bold text-zinc-900 dark:text-zinc-100"></h2>
                            </div>

                            <div class="flex flex-col sm:flex-row gap-6 mt-4 flex-grow items-start">
                                
                                <div class="w-full sm:w-1/3 md:w-1/4 aspect-square shrink-0 border-2 border-zinc-900 dark:border-zinc-600 bg-zinc-100 dark:bg-zinc-700 overflow-hidden">
                                    <a :href="`https://www.youtube.com/watch?v=${activeCamp.video_id}`" target="_blank" class="hover:opacity-70 transition">
                                        <img :src="activeCamp.video_id ? `https://img.youtube.com/vi/${activeCamp.video_id}/mqdefault.jpg` : `https://picsum.photos/seed/${encodeURIComponent(activeCamp.title)}/300`"
                                            alt="activeCamp.title"
                                            class="w-full h-full object-cover" />
                                    </a>
                                </div>

                                <div class="flex flex-col flex-grow h-full justify-between">
                                    <div>
                                        <p class="font-bold">YouTube Description:</p>
                                        <p x-text="activeCamp.description"
                                            class="text-zinc-600 dark:text-zinc-300 mb-4 text-base font-medium leading-relaxed">
                                        </p>

                                        <p class="font-bold mt-2">Developer Note:</p>
                                        <p x-show="activeCamp.note && activeCamp.note.trim() !== ''" x-text="activeCamp.note"
                                            class="text-amber-600 mb-4 text-base font-medium leading-relaxed"></p>
                                        <p x-show="!activeCamp.note || activeCamp.note.trim() === ''"
                                            class="text-amber-600 mb-4 text-base font-medium leading-relaxed">None.</p>
                                    </div>
                                </div>
                            </div>

                            <div class="flex flex-wrap flex-row justify-between items-center gap-4 pt-4">
                                <a :href="`https://www.youtube.com/watch?v=${activeCamp.video_id}`" target="_blank"
                                    class="px-6 py-2 bg-red-600 text-white font-bold text-sm tracking-wide hover:bg-red-700 transition whitespace-nowrap">
                                    WATCH ON YOUTUBE
                                </a>
                                <div
                                    class="flex flex-wrap items-center gap-2 text-sm font-bold text-zinc-500 dark:text-zinc-400">
                                    <a :href="`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(activeCamp.location)}`"
                                        target="_blank"
                                        class="text-blue-500 dark:text-blue-400 underline hover:text-blue-800 dark:hover:text-blue-300 transition">
                                        Check on Google Maps
                                    </a>
                                    <span class="text-pink-600 dark:text-pink-400 ml-2"
                                        x-text="`📍 ${activeCamp.city}`"></span>
                                    <span class="ml-2" x-text="`🗓️ ${activeCamp.date}`"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <template x-if="!activeCamp">
                    <div
                        class="flex flex-col items-center justify-center flex-grow p-12 text-center text-zinc-400 dark:text-zinc-500">
                        <span class="text-4xl mb-3">🏕️</span>
                        <p class="font-bold uppercase tracking-wider text-sm">No Location Selected</p>
                        <p class="text-xs mt-1">Please select an adventure from the list or clear your search filters.
                        </p>
                    </div>
                </template>
            </div>
        </div>

        <footer class="text-center text-sm font-bold text-zinc-500 dark:text-zinc-400 mt-4 shrink-0">
            Made with ❤️ and ☕ by Fans for Fans
            ·
            <a href="https://github.com/moonbrooke/hunker-down-explorer"
                class="text-blue-500 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition">GitHub</a>
            ·
            <a href="https://github.com/moonbrooke/hunker-down-explorer/blob/main/CONTRIBUTING.md"
                class="text-blue-500 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition">Contribute</a>
            ·
            <a href="https://github.com/moonbrooke/hunker-down-explorer/blob/main/DISCLAIMER.md"
                class="text-blue-500 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition">Disclaimer/ToS</a>
            ·
            <a href="https://github.com/moonbrooke/hunker-down-explorer/blob/main/PRIVACY.md"
                class="text-blue-500 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition">Privacy
                Policy</a>
            <p>I'm not a GeoGuessr expert, so some of the locations aren't pinpoint accurate. Feel free to contribute!
                🙂</p>
        </footer>
    </div>

    <script src="data.js"></script>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('hunkerApp', () => ({
                isDark: document.documentElement.classList.contains('dark'),
                searchQuery: '',
                currentFilter: null,
                sortBy: 'date',
                sortDesc: true,
                activeCamp: null,

                init() {
                    // Update active camp when filters/sorts change
                    this.$watch('searchQuery', () => this.checkActiveCamp());
                    this.$watch('currentFilter', () => this.checkActiveCamp());
                    this.$watch('sortBy', () => this.checkActiveCamp());
                    this.$watch('sortDesc', () => this.checkActiveCamp());

                    const initialCamps = this.filteredCamps;
                    if (initialCamps.length > 0) {
                        this.activeCamp = initialCamps[0];
                    }
                },

                toggleTheme() {
                    this.isDark = !this.isDark;
                    if (this.isDark) {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    }
                },

                get filteredCamps() {
                    let result = campData.filter(camp => {
                        if (this.currentFilter === 'stealth' && !camp.stealth) return false;
                        if (this.currentFilter === 'non-stealth' && camp.stealth) return false;

                        if (this.searchQuery) {
                            const query = this.searchQuery.toLowerCase();
                            const statusText = camp.stealth ? "stealth" : "non-stealth";
                            return (
                                camp.title.toLowerCase().includes(query) ||
                                camp.city.toLowerCase().includes(query) ||
                                camp.date.includes(query) ||
                                statusText.includes(query)
                            );
                        }
                        return true;
                    });

                    result.sort((a, b) => {
                        let valA = this.sortBy === 'date' ? a.date : a.title.toLowerCase();
                        let valB = this.sortBy === 'date' ? b.date : b.title.toLowerCase();

                        if (valA < valB) return this.sortDesc ? 1 : -1;
                        if (valA > valB) return this.sortDesc ? -1 : 1;
                        return 0;
                    });

                    return result;
                },

                checkActiveCamp() {
                    const camps = this.filteredCamps;
                    if (!camps.includes(this.activeCamp)) {
                        this.activeCamp = camps.length > 0 ? camps[0] : null;
                    }
                }
            }));
        });
    </script>
</body>

</html>
